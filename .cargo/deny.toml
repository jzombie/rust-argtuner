[advisories]
ignore = [
  "RUSTSEC-2024-0436",
  # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173); no safe upgrade exists.
  # It is a build-time-only transitive dependency (rstml -> syn_derive) with no
  # upstream fix available, so it cannot be migrated away from.
  "RUSTSEC-2026-0173",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
