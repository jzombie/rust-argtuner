
[package]
name = "argtuner"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "argtuner"

[package.metadata.cargo-udeps.ignore]
normal = ["windows-sys"]

[workspace]
members = [
    "bindings/rust",
    "bindings/talkback-derive",
    "crates/common",
    "crates/interactive-probe",
    "crates/loss-generator",
]
resolver = "2"

[workspace.package]
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
version = "0.1.0-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"

# Don't publish yet
publish = false

[workspace.dependencies]
argtuner-common = { path = "crates/common" }
argtuner-talkback = { path = "bindings/rust" }
argtuner-talkback-derive = { path = "bindings/talkback-derive" }
clap = "4.5.53"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
rand = "0.8"

[dependencies]
argmin = "0.11"
argmin-math = { version = "0.5.1", features = ["vec"] }
argtuner-common = { workspace = true }
argtuner-talkback = { workspace = true, features = ["clap"] }
argtuner-talkback-derive = { workspace = true }
chrono = { version = "0.4.42", features = ["serde", "alloc"] }
clap = { workspace = true, features = ["derive"] }
crossterm = "0.29.0"
csv = "1.3"
libc = "0.2.176"
portable-pty = "0.9.0"
rand.workspace = true
ratatui = "0.30.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words = "1.1.1"
tempfile = "3.10"
thiserror = "1.0"
toml = "0.9.10"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
indoc = "2.0.7"
