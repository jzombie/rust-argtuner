
[package]
name = "argtuner"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["hyperparameter", "optimization", "cli", "pso", "tuning"]
categories = ["command-line-utilities", "science", "algorithms"]
default-run = "argtuner"

[package.metadata.cargo-udeps.ignore]
normal = ["windows-sys"]

[workspace]
members = [
    "crates/argtuner-derive",
    "crates/argtuner-sdk",
    "crates/common",
    "crates/deprecated/argtuner-talkback",
    "crates/deprecated/argtuner-talkback-derive",
    "crates/mock-bin",
]
resolver = "2"

[workspace.package]
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
version = "0.1.2-alpha"
edition = "2024"
description = "Project-based command-template hyperparameter tuner CLI."
repository = "https://github.com/jzombie/rust-argtuner"
license = "MIT OR Apache-2.0"
publish = true

[workspace.dependencies]
argmin = { version = "0.11", features = ["serde1"] }
argmin-math = { version = "0.5.1", features = ["vec"] }
argtuner = { path = ".", version = "0.1.2-alpha" }
argtuner-common = { path = "crates/common", version = "0.1.2-alpha" }
argtuner-derive = { path = "crates/argtuner-derive", version = "0.1.2-alpha" }
argtuner-sdk = { path = "crates/argtuner-sdk", version = "0.1.2-alpha" }
chrono = { version = "0.4.42", features = ["serde", "alloc"] }
clap = "4.5.53"
command-group = "5.0.1"
crossterm = "0.29.0"
csv = "1.3"
ctrlc = "3.5.2"
hostname = "0.4.2"
ignore = "0.4.33"
indicatif = "0.18.3"
indoc = "2.0.7"
jsonschema = { version = "0.49.9", default-features = false }
libc = "0.2.176"
line-ending = "1.5.1"
portable-pty = "0.9.0"
rand = "0.10.2"
ratatui = "0.30.0"
resvg = "0.45.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
shell-words = "1.1.1"
similar = "2.7.0"
tempfile = "3.10"
term-wm = "0.9.25-alpha"
term-wm-console = "0.9.25-alpha"
term-wm-core = "0.9.25-alpha"
term-wm-render = "0.9.25-alpha"
term-wm-ui-facade = "0.9.25-alpha"
thiserror = "2.0.17"
toml = "1.1.4"
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[[bin]]
name = "argtuner"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:argmin",
    "dep:argmin-math",
    "dep:chrono",
    "dep:command-group",
    "dep:crossterm",
    "dep:csv",
    "dep:ctrlc",
    "dep:hostname",
    "dep:ignore",
    "dep:libc",
    "dep:line-ending",
    "dep:portable-pty",
    "dep:rand",
    "dep:ratatui",
    "dep:rusqlite",
    "dep:shell-words",
    "dep:similar",
    "dep:tempfile",
    "dep:term-wm",
    "dep:term-wm-console",
    "dep:term-wm-core",
    "dep:term-wm-render",
    "dep:term-wm-ui-facade",
    "dep:thiserror",
    "dep:toml",
    "dep:tracing",
    "dep:windows-sys",
]

[dependencies]
argmin = { workspace = true, optional = true }
argmin-math = { workspace = true, features = ["vec"], optional = true }
argtuner-common.workspace = true
chrono = { workspace = true, features = ["serde", "alloc"], optional = true }
clap = { workspace = true, features = ["derive"] }
command-group = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
line-ending = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
term-wm = { workspace = true, optional = true }
term-wm-console = { workspace = true, optional = true }
term-wm-core = { workspace = true, optional = true }
term-wm-render = { workspace = true, optional = true }
term-wm-ui-facade = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, features = ["serde"] }
tracing = { workspace = true, optional = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"], optional = true }

[dev-dependencies]
argtuner-sdk.workspace = true
indicatif.workspace = true
indoc.workspace = true
jsonschema.workspace = true
line-ending.workspace = true
