[package]
name = "argtuner-talkback-derive"
version.workspace = true
edition.workspace = true
description = "Procedural macro helpers for argtuner-talkback."
repository.workspace = true
license.workspace = true
publish.workspace = true
keywords = ["derive", "proc-macro", "cli", "clap", "hyperparameter"]
categories = ["development-tools::procedural-macro-helpers", "command-line-interface"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", features = ["full"] }

[dev-dependencies]
argtuner-talkback = { workspace = true, features = ["clap"] }
