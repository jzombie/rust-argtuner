[package]
name = "argtuner-talkback"
version.workspace = true
edition.workspace = true
description = "Rust bindings for emitting argtuner talkback JSON events."
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
clap = ["dep:clap"]

[dependencies]
argtuner-common.workspace = true
