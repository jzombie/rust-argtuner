[package]
name = "argtuner-derive"
version.workspace = true
edition.workspace = true
description = "Procedural macro for the argtuner SDK: generates a clap CLI, command template, and search space from a plain struct."
repository.workspace = true
license.workspace = true
publish.workspace = true
keywords = ["derive", "proc-macro", "cli", "clap", "hyperparameter"]
categories = ["development-tools::procedural-macro-helpers", "command-line-interface"]

# The dev-dependency is used only by the crate's doctest (rustdoc compiles
# doctests as separate crates, which cargo-udeps does not account for), so udeps
# flags it as unused.
[package.metadata.cargo-udeps.ignore]
development = ["argtuner-sdk"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
argtuner-common = { path = "../common" }
argtuner-sdk = { path = "../argtuner-sdk" }
