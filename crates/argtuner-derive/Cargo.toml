[package]
name = "argtuner-derive"
version.workspace = true
edition.workspace = true
description = "Procedural macro for the argtuner SDK: generates a clap CLI, command template, and search space from a plain struct."
repository.workspace = true
license.workspace = true
publish.workspace = true
keywords = ["derive", "proc-macro", "cli", "clap", "hyperparameter"]
categories = ["development-tools::procedural-macro-helpers", "command-line-interface"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", features = ["full"] }
