template = "cargo run -p argtuner --example pareto_demo -- --learning-rate {learning_rate} --batch-size {batch_size} --checkpoint-dir {trial_dir}"

[project]
metric_key = "loss"
goal = "min"

[[project.objectives]]
name = "loss"
goal = "min"
primary = true

[[project.objectives]]
name = "latency_ms"
goal = "min"

[sampler]
type = "random"

[scheduler]
type = "fixed"
n_trials = 6

[space]
[[space.params]]
type = "Float"
name = "learning_rate"
min = 0.001
max = 0.1
log = true

[[space.params]]
type = "Choice"
name = "batch_size"
values = ["16", "32", "64"]
